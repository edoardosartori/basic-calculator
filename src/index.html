<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow b"></div><div class="glow p"></div><div class="glow c"></div>

<main class="card" aria-label="Calculator">
  <div class="screen" role="group" aria-label="Display">
    <div class="expr" id="expr" aria-hidden="true">&nbsp;</div>
    <div class="value" id="val" aria-live="polite">0</div>
  </div>
  <div class="pad" id="pad">
    <button class="fn w2" data-k="C" aria-label="Clear">C</button>
    <button class="fn" data-k="Backspace" aria-label="Delete last digit">&larr;</button>
    <button class="op" data-k="/" aria-label="Divide">&divide;</button>

    <button class="num" data-k="7">7</button>
    <button class="num" data-k="8">8</button>
    <button class="num" data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiply">&times;</button>

    <button class="num" data-k="4">4</button>
    <button class="num" data-k="5">5</button>
    <button class="num" data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Subtract">&minus;</button>

    <button class="num" data-k="1">1</button>
    <button class="num" data-k="2">2</button>
    <button class="num" data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>

    <button class="num w2" data-k="0">0</button>
    <button class="num" data-k=".">.</button>
    <button class="eq" data-k="=" aria-label="Equals">=</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
